<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Soonho Kwon (권순호) — HCI and design researcher, Ph.D. student in Human-Centered Computing at Georgia Tech.">
<title>Soonho Kwon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Noto+Sans+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#about">Soonho Kwon<small>권순호 · 權純湖</small></a>
    <nav class="main" aria-label="Main">
      <a href="#about" data-nav="about">About</a>
      <a href="#publications" data-nav="publications">Publications</a>
      <a href="#artwork" data-nav="artwork">Artwork</a>
      <a id="cv-link" href="#" target="_blank" rel="noopener">CV</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<footer><div class="wrap"><span id="foot-name"></span><span>Georgia Institute of Technology · Atlanta</span></div></footer>

<script src="content.js?v=14"></script>
<script>
/* =====================================================================
   PAGE LOGIC — no need to edit below.
   ===================================================================== */

if (GA_ID) {
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag("js", new Date()); gtag("config", GA_ID);
}

PROJECTS.forEach(p => { p.kind = "project"; p.type = "Ongoing Project"; });
PAPERS.forEach(p => { p.kind = "paper"; });
const ALL = [...PROJECTS, ...PAPERS];

const $view = document.getElementById("view");
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const paras = s => String(s || "").split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join("");
const linkLabels = { paper: "Full Paper", pdf: "PDF", doi: "Full Paper", arxiv: "arXiv", project: "Link", video: "Video", ars: "Ars Electronica", slides: "Slides" };
const ext = `target="_blank" rel="noopener"`;
const hrefOf = p => `#${p.kind}-${p.id}`;

document.getElementById("cv-link").href = SITE.cv;
document.getElementById("foot-name").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;

function authorsHTML(list) {
  return list.map(a => a === ME ? `<b>${esc(a)}</b>` : esc(a)).join(", ");
}
function chips(ids) {
  return ids.filter(id => topicById[id]).map(id => {
    const t = topicById[id];
    return `<a class="chip" href="#topic-${t.id}"><i style="background:var(${t.color})"></i>${esc(t.short || t.name)}</a>`;
  }).join("");
}
function venueHTML(p) {
  if (!p.venue) return "";
  return `<div class="venue">${esc(p.venue)}</div>`;
}
function kindHTML(p) {
  return `<div class="kind">${esc(p.short || p.type)}${p.status ? ` · <span class="status">${esc(p.status)}</span>` : ""}</div>`;
}
function entryHTML(p) {
  const quick = Object.entries(p.links || {}).filter(([, v]) => v).slice(0, 2)
    .map(([k, v]) => `<a href="${esc(v)}" ${ext}>${linkLabels[k] || esc(k)}</a>`).join("");
  return `<li class="entry">
    ${kindHTML(p)}
    <a class="title" href="${hrefOf(p)}">${esc(p.title)}</a>
    <div class="authors">${authorsHTML(p.authors)}</div>
    ${venueHTML(p)}
    <div class="meta">
      ${p.award ? `<span class="award">${esc(p.award)}</span>` : ""}
      ${chips(p.topics)}
      ${quick ? `<span class="links-inline">${quick}</span>` : ""}
    </div>
  </li>`;
}
function figureHTML(src, alt, caption) {
  if (!src) return "";
  return `<figure>
    <div class="fig"><img src="${esc(src)}" alt="${esc(alt)}" referrerpolicy="no-referrer" loading="lazy"
      onerror="this.closest('figure').remove()"></div>
    ${caption ? `<figcaption>${esc(caption)}</figcaption>` : ""}
  </figure>`;
}

function renderAbout() {
  const initials = SITE.name.split(" ").map(w => w[0]).join("");
  const areas = TOPICS.map((t, i) =>
    `<p>(${i + 1}) <a href="#topic-${t.id}">${esc(t.name)}</a>: ${esc(t.blurb)}</p>`).join("");
  $view.innerHTML = `<div class="about">
    <div class="side">
      <div class="portrait">${SITE.photo
        ? `<img src="${esc(SITE.photo)}" alt="Portrait of ${esc(SITE.name)}" onerror="this.replaceWith(document.createTextNode('${initials}'))">`
        : initials}</div>
      <div class="contact">
        <span class="email">${esc(SITE.email)}</span>
        ${SITE.links.map(l => `<a href="${esc(l.url)}" ${ext}>${esc(l.label)}</a>`).join("")}
        <a href="${esc(SITE.cv)}" ${ext}>CV</a>
      </div>
    </div>
    <div class="about-text">
      <h1>${esc(SITE.name)}</h1>
      <div class="names">${esc(SITE.names)}</div>
      <div class="prose">
        <p>${SITE.intro}</p>
        ${areas}
        ${SITE.outro.map(p => `<p>${p}</p>`).join("")}
      </div>
    </div>
  </div>`;
}

function railHTML(activeId) {
  const count = id => ALL.filter(p => p.topics.includes(id)).length;
  return `<aside class="rail">
    <h2>By Topic</h2>
    <ul class="topics">
      <li><a href="#publications" aria-current="${!activeId}"><span>All work</span><span class="n">${ALL.length}</span></a></li>
      ${TOPICS.map(t => `<li><a href="#topic-${t.id}" aria-current="${activeId === t.id}">
        <span><i class="tdot" style="background:var(${t.color})"></i>${esc(t.name)}</span><span class="n">${count(t.id)}</span></a></li>`).join("")}
    </ul>
  </aside>`;
}

function renderPublications(topicId) {
  const topic = topicId ? topicById[topicId] : null;
  const inTopic = p => !topic || p.topics.includes(topic.id);
  const projects = PROJECTS.filter(inTopic);
  const papers = PAPERS.filter(inTopic).sort((a, b) => b.year - a.year);
  const years = [...new Set(papers.map(p => p.year))];
  $view.innerHTML = `<div class="proj">
    ${railHTML(topic?.id)}
    <section>
      <div class="proj-head">
        <div class="eyebrow">${topic ? "Topic" : "Publications"}</div>
        <h1>${topic ? esc(topic.name) : "Publications and Projects"}</h1>
        ${topic ? "" : `<p class="sub">Papers by year, followed by ongoing projects. Choose a topic to see how each line of work connects.</p>`}
      </div>
      ${topic ? `<div class="narrative">${topic.narrative.map(p => `<p>${p}</p>`).join("")}</div>` : ""}
      ${years.map(y => `<div class="group"><h2>${y}</h2>
        <ul class="entries">${papers.filter(p => p.year === y).map(entryHTML).join("")}</ul></div>`).join("")}
      ${projects.length ? `<div class="group"><h2>Ongoing</h2><ul class="entries">${projects.map(entryHTML).join("")}</ul></div>` : ""}
      ${!projects.length && !papers.length ? `<p class="empty">Nothing in this topic yet.</p>` : ""}
    </section>
  </div>`;
}

function renderDetail(kind, id) {
  const p = ALL.find(x => x.kind === kind && x.id === id);
  if (!p) return renderPublications();
  const related = (p.related || []).map(id => ALL.find(x => x.id === id)).filter(Boolean);
  const btns = Object.entries(p.links || {}).filter(([, v]) => v)
    .map(([k, v], i) => `<a class="btn${i === 0 ? " primary" : ""}" href="${esc(v)}" ${ext}>${linkLabels[k] || esc(k)}</a>`).join("");
  $view.innerHTML = `<div class="proj">
    ${railHTML(p.topics[0])}
    <article class="paper">
      <a class="back" href="#publications">← All work</a>
      ${kindHTML(p)}
      <h1>${esc(p.title)}</h1>
      <div class="authors">${authorsHTML(p.authors)}</div>
      ${venueHTML(p)}
      <div class="meta">${p.award ? `<span class="award">${esc(p.award)}</span>` : ""}${chips(p.topics)}</div>
      ${figureHTML(p.image, p.caption || p.title, p.caption)}
      <div class="summary">${paras(p.summary)}</div>
      ${btns ? `<div class="btns">${btns}</div>` : ""}
      ${related.length ? `<div class="related"><h2>Related work</h2><ul class="entries">${related.map(entryHTML).join("")}</ul></div>` : ""}
    </article>
  </div>`;
}

function renderArtwork() {
  $view.innerHTML = `<section>
    <div class="proj-head">
      <div class="eyebrow">Artwork</div>
      <h1>Artwork</h1>
      <p class="sub">Video, installation, film, print, and photography.</p>
    </div>
    <ul class="art-grid">
      ${ARTWORKS.map(a => {
        const url = a.page ? `#${a.page}` : (a.url || (a.youtube ? `https://www.youtube.com/watch?v=${a.youtube}` : ""));
        const thumb = a.image || (a.youtube ? `https://i.ytimg.com/vi/${a.youtube}/hqdefault.jpg` : "");
        const inner = `<div class="art-thumb">${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span>${esc(a.medium)}</span>`}</div>
          <div class="art-body"><div class="art-title">${esc(a.title)}</div>
          <div class="venue">${esc(a.medium)} · <span class="short">${a.year}</span></div>
          ${a.award ? `<span class="award">${esc(a.award)}</span>` : ""}</div>`;
        return `<li class="art-item">${url ? `<a href="${esc(url)}" ${a.page ? "" : ext}>${inner}</a>` : inner}</li>`;
      }).join("")}
    </ul>
  </section>`;
}

function route() {
  const h = location.hash.replace(/^#/, "");
  let section = "about";
  if (h.startsWith("paper-")) { renderDetail("paper", h.slice(6)); section = "publications"; }
  else if (h.startsWith("project-")) { renderDetail("project", h.slice(8)); section = "publications"; }
  else if (h.startsWith("topic-")) { renderPublications(h.slice(6)); section = "publications"; }
  else if (h === "publications" || h === "projects") { renderPublications(); section = "publications"; }
  else if (h === "artwork") { renderArtwork(); section = "artwork"; }
  else renderAbout();
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === section) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
