/* Layout: quiet academic site. Top bar + single reading column on About;
   Projects = left topic rail + year-grouped list; paper pages = one column with figure. */
:root {
  --bg: #f6f7f5;          /* paper with a faint celadon cast */
  --surface: #ffffff;
  --fg: #1b2322;          /* ink */
  --muted: #5d6a67;
  --line: #dbe1de;
  --accent: #2f6f64;      /* celadon green, deepened for contrast */
  --accent-soft: #e3eeeb;
  --award: #8a5a12;
  --award-soft: #f5ecdc;

  --t1: #3c6e8f; --t2: #7a5a9b; --t3: #9a6a2e; --t4: #5d6a67; --t5: #2f6f64;

  --display: "Gowun Batang", "Noto Serif KR", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --measure: 64ch;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131817; --surface: #1a201f; --fg: #e6ebe9; --muted: #9aa8a4; --line: #2c3533;
    --accent: #7cc3b4; --accent-soft: #1f302c; --award: #e0b46a; --award-soft: #2e271a;
    --t1: #8ab8d6; --t2: #bca1db; --t3: #d9aa6e; --t4: #a5b1ae; --t5: #7cc3b4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131817; --surface: #1a201f; --fg: #e6ebe9; --muted: #9aa8a4; --line: #2c3533;
  --accent: #7cc3b4; --accent-soft: #1f302c; --award: #e0b46a; --award-soft: #2e271a;
  --t1: #8ab8d6; --t2: #bca1db; --t3: #d9aa6e; --t4: #a5b1ae; --t5: #7cc3b4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  margin: 0;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.25; text-wrap: balance; margin: 0; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 24px; }
@media (max-width: 600px) { .wrap { padding-inline: 18px; } body { font-size: 16px; } }

/* ---------- top bar ---------- */
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-block: 16px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 1.25rem; font-weight: 700; color: var(--fg); text-decoration: none; }
.brand small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: .85rem; margin-left: 8px; }
nav.main { display: flex; gap: 22px; font-size: .95rem; }
nav.main a { color: var(--muted); text-decoration: none; padding-bottom: 2px; border-bottom: 2px solid transparent; }
nav.main a:hover { color: var(--fg); }
nav.main a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 48px 96px; }
.eyebrow { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- about ---------- */
.about { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; align-items: start; }
@media (max-width: 760px) { .about { grid-template-columns: 1fr; gap: 28px; } }
.portrait {
  width: 100%; max-width: 220px; aspect-ratio: 4 / 5; border-radius: 4px;
  background: var(--accent-soft); display: grid; place-items: center;
  font-family: var(--display); font-size: 3.4rem; color: var(--accent); overflow: hidden;
}
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.contact { margin-top: 18px; display: grid; gap: 6px; font-size: .92rem; }
.contact .email { font-family: var(--mono); font-size: .85rem; color: var(--muted); user-select: all; }
.contact .links { display: flex; flex-wrap: wrap; gap: 6px 14px; }

.about-text { max-width: var(--measure); }
.about-text h1 { font-size: clamp(2.2rem, 5vw, 3rem); }
.about-text .ko { font-family: var(--display); color: var(--muted); font-size: 1.1rem; margin-top: 4px; }
.lede { font-size: 1.14rem; margin: 28px 0 0; }
.about-text p { margin: 18px 0 0; }
.areas { list-style: none; padding: 0; margin: 36px 0 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.areas li { padding: 18px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 12px minmax(0,1fr); gap: 14px; }
.areas .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 10px; }
.areas a.t { font-family: var(--display); font-weight: 700; font-size: 1.08rem; color: var(--fg); text-decoration: none; }
.areas a.t:hover { color: var(--accent); }
.areas p { margin: 4px 0 0; color: var(--muted); font-size: .96rem; }
.stance { margin-top: 36px; padding-left: 18px; border-left: 2px solid var(--accent); font-family: var(--display); font-size: 1.08rem; line-height: 1.7; }

/* ---------- projects ---------- */
.proj { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; align-items: start; }
@media (max-width: 860px) { .proj { grid-template-columns: 1fr; gap: 24px; } }
aside.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
aside.rail h2 { font-family: var(--mono); font-weight: 500; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.topics { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.topics a {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 8px 10px; border-radius: 4px; color: var(--fg); text-decoration: none; font-size: .93rem; line-height: 1.35;
}
.topics a:hover { background: var(--accent-soft); }
.topics a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.topics .n { font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  aside.rail { position: static; }
  .topics { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 6px; scrollbar-width: thin; }
  .topics a { white-space: nowrap; border: 1px solid var(--line); }
}

.proj-head h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
.proj-head .sub { color: var(--muted); margin: 8px 0 0; }
.narrative {
  margin-top: 24px; padding: 22px 24px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; max-width: 72ch;
}
.narrative .eyebrow { margin-bottom: 8px; }
.narrative p { margin: 0; }
.narrative p + p { margin-top: 12px; }

.year { margin-top: 44px; }
.year h2 { font-family: var(--mono); font-weight: 500; font-size: .9rem; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.entries { list-style: none; margin: 0; padding: 0; }
.entry { padding: 20px 0; border-bottom: 1px solid var(--line); display: grid; gap: 5px; }
.entry .title { font-family: var(--display); font-weight: 700; font-size: 1.12rem; line-height: 1.4; color: var(--fg); text-decoration: none; }
.entry .title:hover { color: var(--accent); text-decoration: underline; }
.authors { font-size: .95rem; }
.authors b { font-weight: 600; }
.venue { font-size: .9rem; color: var(--muted); }
.venue .short { font-family: var(--mono); font-size: .8rem; color: var(--fg); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 4px; }
.chip {
  font-size: .76rem; line-height: 1; padding: 5px 8px 5px 7px; border-radius: 99px; text-decoration: none;
  border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; background: var(--surface);
}
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.award { font-size: .76rem; font-weight: 600; padding: 4px 8px; border-radius: 3px; background: var(--award-soft); color: var(--award); }
.links-inline { display: flex; gap: 14px; font-size: .88rem; margin-left: auto; }
.empty { color: var(--muted); padding: 28px 0; }

/* ---------- paper detail ---------- */
.paper { max-width: 760px; }
.back { font-size: .92rem; text-decoration: none; display: inline-flex; gap: 6px; }
.paper h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); margin-top: 20px; }
.paper .authors { margin-top: 14px; font-size: 1rem; }
.paper .venue { margin-top: 4px; font-size: .95rem; }
.paper .meta { margin-top: 14px; }
figure { margin: 32px 0 0; }
.fig {
  width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden;
  background: var(--accent-soft); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--muted); font-family: var(--mono); font-size: .8rem;
  background-image: repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--accent) 7%, transparent) 14px 15px);
}
.fig img { width: 100%; height: 100%; object-fit: cover; }
figcaption { font-size: .86rem; color: var(--muted); margin-top: 10px; }
.paper .summary { margin-top: 32px; max-width: var(--measure); }
.paper .summary p { margin: 0 0 16px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.btn {
  font-size: .9rem; padding: 9px 14px; border-radius: 4px; text-decoration: none;
  border: 1px solid var(--accent); color: var(--accent); font-weight: 500;
}
.btn.primary { background: var(--accent); color: var(--bg); }
.btn:hover { background: var(--accent-soft); }
.btn.primary:hover { background: var(--accent); opacity: .9; }
.related { margin-top: 56px; border-top: 1px solid var(--line); padding-top: 20px; }
.related h2 { font-family: var(--mono); font-weight: 500; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 24px; font-size: .82rem; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .35s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

/* ---------- additions ---------- */
.kind { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kind .status { color: var(--accent); }
.tdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
.topics a > span:first-child { min-width: 0; }
.narrative { border-left: 3px solid var(--tc, var(--accent)); }
.paper .kind { margin-top: 20px; }
.paper h1 { margin-top: 8px; }
.art-grid { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 24px; }
.art-item a { color: inherit; text-decoration: none; display: block; }
.art-item a:hover .art-title { color: var(--accent); text-decoration: underline; }
.art-thumb {
  aspect-ratio: 16 / 9; max-width: 100%; border-radius: 4px; overflow: hidden; border: 1px solid var(--line);
  background: var(--accent-soft); display: grid; place-items: center;
  color: var(--muted); font-family: var(--mono); font-size: .75rem; letter-spacing: .04em;
  background-image: repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--accent) 7%, transparent) 14px 15px);
}
.art-thumb img { width: 100%; height: 100%; object-fit: cover; }
.art-body { display: grid; gap: 4px; margin-top: 12px; justify-items: start; }
.art-title { font-family: var(--display); font-weight: 700; font-size: 1.08rem; line-height: 1.35; }
@media (max-width: 860px) { .paper .back { display: none; } }
.proj > *, .about > * { min-width: 0; }
.entry .title, .paper h1 { overflow-wrap: anywhere; }
</style>
</head>

/* Artwork. `youtube` is the video id (the part after watch?v=); its thumbnail is shown automatically. */
const ARTWORKS = [
  { title: "AI Fortuneteller", medium: "Video Art", year: 2024, award: "Honorary Mention, Prix Ars Electronica 2024", youtube: "Y21DGAZQWMU" },
  { title: "Existence Effacement Service", medium: "Interactive Art", year: 2023 },
  { title: "The Great Primitive Thinker", medium: "Speculative Novel & Media Installation", year: 2023 },
  { title: "Purple Night", medium: "Short Documentary Film", year: 2020, youtube: "L7FiZeaj5Xc" },
  { title: "The Aristocrats", medium: "Printed Artwork", year: 2019 },
  { title: "Himmel and Blair", medium: "Printed Artwork", year: 2018 },
  { title: "Pinocchio", medium: "Photograph", year: 2017 }
];

/* Analytics: paste your Google Analytics measurement ID (starts with "G-") to start counting visits. */
const GA_ID = "";

/* =====================================================================
   PAGE LOGIC — no need to edit below.
   ===================================================================== */

if (GA_ID) {
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag("js", new Date()); gtag("config", GA_ID);
}

const $view = document.getElementById("view");
const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const paras = s => String(s || "").split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join("");
const linkLabels = { pdf: "PDF", doi: "DOI", arxiv: "arXiv", project: "Link", video: "Video", slides: "Slides" };
const ext = `target="_blank" rel="noopener"`;

document.getElementById("cv-link").href = SITE.cv;
document.getElementById("foot-name").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;

function authorsHTML(list) {
  return list.map(a => a === ME ? `<b>${esc(a)}</b>` : esc(a)).join(", ");
}
function chips(ids) {
  return ids.filter(id => topicById[id]).map(id => {
    const t = topicById[id];
    return `<a class="chip" href="#topic-${t.id}"><i style="background:var(${t.color})"></i>${esc(t.name)}</a>`;
  }).join("");
}
function venueHTML(p) {
  return `${esc(p.venue)}${p.short ? ` · <span class="short">${esc(p.short)}</span>` : ""}`;
}
function entryHTML(p) {
  const quick = Object.entries(p.links || {}).filter(([, v]) => v).slice(0, 2)
    .map(([k, v]) => `<a href="${esc(v)}" ${ext}>${linkLabels[k] || esc(k)}</a>`).join("");
  return `<li class="entry">
    <div class="kind">${esc(p.type)}${p.status ? ` · <span class="status">${esc(p.status)}</span>` : ""}</div>
    <a class="title" href="#paper-${p.id}">${esc(p.title)}</a>
    <div class="authors">${authorsHTML(p.authors)}</div>
    <div class="venue">${venueHTML(p)}</div>
    <div class="meta">
      ${p.award ? `<span class="award">${esc(p.award)}</span>` : ""}
      ${chips(p.topics)}
      ${quick ? `<span class="links-inline">${quick}</span>` : ""}
    </div>
  </li>`;
}
function figureHTML(src, alt, caption) {
  if (!src) return "";
  return `<figure>
    <div class="fig"><img src="${esc(src)}" alt="${esc(alt)}" referrerpolicy="no-referrer" loading="lazy"
      onerror="this.closest('figure').remove()"></div>
    ${caption ? `<figcaption>${esc(caption)}</figcaption>` : ""}
  </figure>`;
}

function renderAbout() {
  const initials = SITE.name.split(" ").map(w => w[0]).join("");
  $view.innerHTML = `<div class="about">
    <div>
      <div class="portrait">${SITE.photo
        ? `<img src="${esc(SITE.photo)}" alt="Portrait of ${esc(SITE.name)}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${initials}'))">`
        : initials}</div>
      <div class="contact">
        <span class="email">${esc(SITE.email)}</span>
        <span class="links">${SITE.links.map(l => `<a href="${esc(l.url)}" ${ext}>${esc(l.label)}</a>`).join("")}
          <a href="${esc(SITE.cv)}" ${ext}>CV</a></span>
      </div>
    </div>
    <div class="about-text">
      <h1>${esc(SITE.name)}</h1>
      <div class="ko">${esc(SITE.nameKo)}</div>
      <p class="lede">${SITE.lede}</p>
      <ul class="areas" aria-label="Research topics">
        ${TOPICS.map(t => `<li><span class="dot" style="background:var(${t.color})"></span>
          <div><a class="t" href="#topic-${t.id}">${esc(t.name)}</a><p>${esc(t.blurb)}</p></div></li>`).join("")}
      </ul>
      <p class="stance">${SITE.stance}</p>
      <p>${SITE.closing}</p>
      <p><a href="#publications">See all publications →</a></p>
    </div>
  </div>`;
}

function railHTML(activeId) {
  const count = id => PAPERS.filter(p => p.topics.includes(id)).length;
  return `<aside class="rail">
    <h2>By Topic</h2>
    <ul class="topics">
      <li><a href="#publications" aria-current="${!activeId}"><span>All publications</span><span class="n">${PAPERS.length}</span></a></li>
      ${TOPICS.map(t => `<li><a href="#topic-${t.id}" aria-current="${activeId === t.id}">
        <span><i class="tdot" style="background:var(${t.color})"></i>${esc(t.name)}</span><span class="n">${count(t.id)}</span></a></li>`).join("")}
    </ul>
  </aside>`;
}

function renderPublications(topicId) {
  const topic = topicId ? topicById[topicId] : null;
  const list = PAPERS.filter(p => !topic || p.topics.includes(topic.id)).sort((a, b) => b.year - a.year);
  const years = [...new Set(list.map(p => p.year))];
  $view.innerHTML = `<div class="proj">
    ${railHTML(topic?.id)}
    <section>
      <div class="proj-head">
        <div class="eyebrow">${topic ? "Topic" : "Publications"}</div>
        <h1>${topic ? esc(topic.name) : "All Publications"}</h1>
        ${topic ? "" : `<p class="sub">Papers, newest first. Choose a topic to see how each line of work connects.</p>`}
      </div>
      ${topic ? `<div class="narrative" style="--tc:var(${topic.color})"><div class="eyebrow">How this work connects</div>${paras(topic.narrative)}</div>` : ""}
      ${list.length ? years.map(y => `<div class="year"><h2>${y}</h2>
        <ul class="entries">${list.filter(p => p.year === y).map(entryHTML).join("")}</ul></div>`).join("")
        : `<p class="empty">No publications in this topic yet.</p>`}
    </section>
  </div>`;
}

function renderPaper(id) {
  const p = PAPERS.find(x => x.id === id);
  if (!p) return renderPublications();
  const related = PAPERS.filter(x => x.id !== p.id && x.topics.some(t => p.topics.includes(t)));
  const btns = Object.entries(p.links || {}).filter(([, v]) => v)
    .map(([k, v], i) => `<a class="btn${i === 0 ? " primary" : ""}" href="${esc(v)}" ${ext}>${linkLabels[k] || esc(k)}</a>`).join("");
  $view.innerHTML = `<div class="proj">
    ${railHTML(p.topics[0])}
    <article class="paper">
      <a class="back" href="#publications">← All publications</a>
      <div class="kind">${esc(p.type)}${p.status ? ` · <span class="status">${esc(p.status)}</span>` : ""}</div>
      <h1>${esc(p.title)}</h1>
      <div class="authors">${authorsHTML(p.authors)}</div>
      <div class="venue">${venueHTML(p)}</div>
      <div class="meta">${p.award ? `<span class="award">${esc(p.award)}</span>` : ""}${chips(p.topics)}</div>
      ${figureHTML(p.image, p.caption || p.title, p.caption)}
      <div class="summary">${paras(p.summary)}</div>
      ${btns ? `<div class="btns">${btns}</div>` : ""}
      ${related.length ? `<div class="related"><h2>Related work</h2><ul class="entries">${related.map(entryHTML).join("")}</ul></div>` : ""}
    </article>
  </div>`;
}

function renderArtwork() {
  $view.innerHTML = `<section class="art">
    <div class="proj-head">
      <div class="eyebrow">Artwork</div>
      <h1>Artwork</h1>
      <p class="sub">Video, installation, film, print, and photography.</p>
    </div>
    <ul class="art-grid">
      ${ARTWORKS.map(a => {
        const url = a.url || (a.youtube ? `https://www.youtube.com/watch?v=${a.youtube}` : "");
        const thumb = a.image || (a.youtube ? `https://i.ytimg.com/vi/${a.youtube}/hqdefault.jpg` : "");
        const inner = `<div class="art-thumb">${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span>${esc(a.medium)}</span>`}</div>
          <div class="art-body"><div class="art-title">${esc(a.title)}</div>
          <div class="venue">${esc(a.medium)} · <span class="short">${a.year}</span></div>
          ${a.award ? `<span class="award">${esc(a.award)}</span>` : ""}</div>`;
        return `<li class="art-item">${url ? `<a href="${esc(url)}" ${ext}>${inner}</a>` : inner}</li>`;
      }).join("")}
    </ul>
  </section>`;
}

function route() {
  const h = location.hash.replace(/^#/, "");
  let section = "about";
  if (h.startsWith("paper-")) { renderPaper(h.slice(6)); section = "publications"; }
  else if (h.startsWith("topic-")) { renderPublications(h.slice(6)); section = "publications"; }
  else if (h === "publications" || h === "projects") { renderPublications(); section = "publications"; }
  else if (h === "artwork") { renderArtwork(); section = "artwork"; }
  else renderAbout();
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === section) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
